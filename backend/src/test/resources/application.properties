# Tests use a disposable PostgreSQL container (see support/TestDatabase), so the
# datasource is injected at runtime. These values are only fallbacks.
spring.datasource.url=jdbc:postgresql://localhost:5432/iot_greenhouse_test
spring.datasource.username=postgres
spring.datasource.password=12345678

# The real schema is applied from database/create-tables.sql, wired onto the test
# classpath under db/ by the pom. ddl-auto stays off so tests exercise the same
# mapping as production.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath*:db/create_tables.sql

mqtt.enabled=false

app.cors.allowed-origin-patterns=http://localhost:5173
