spring.application.name=greenhouse
spring.profiles.active=local

# Credentials are NOT stored here. Supply them through the environment:
#   PowerShell : $env:DB_URL=...; $env:DB_USERNAME=...; $env:DB_PASSWORD=...
# or put them in application-local.properties (git-ignored) for local development.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/iot_greenhouse}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# MQTT. Disabled by default so the app boots without a broker.
# When enabling, point broker-url at a broker YOU control. The previous default was
# the public broker.hivemq.com, where any internet client can subscribe to
# greenhouse/# and read every device's telemetry.
mqtt.enabled=${MQTT_ENABLED:false}
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
# Persistent session: the broker buffers messages while the backend is down and
# delivers them on reconnect. Delivery becomes at-least-once, so a reconnect may
# replay a reading; set true to go back to fire-and-forget.
mqtt.clean-session=${MQTT_CLEAN_SESSION:false}
# Days of telemetry history to keep. A node on a 15s interval adds ~5760 rows a day,
# and GET /api/telemetry returns the whole history in one response, so this must not
# be left unbounded. Set to 0 to disable pruning.
app.telemetry.retention-days=${TELEMETRY_RETENTION_DAYS:30}
app.telemetry.cleanup-interval-ms=${TELEMETRY_CLEANUP_INTERVAL_MS:21600000}

server.port=${PORT:8080}

# Comma-separated origin patterns allowed to call the REST API. Needed whenever the
# frontend is served from a different origin than the API (production build, LAN IP,
# reverse proxy on another port). The Vite dev server proxies /api, so dev does not
# need CORS.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://*.onrender.com}

# Bearer token lifetime before the session must be re-issued.
app.auth.session-ttl-hours=${SESSION_TTL_HOURS:8}
app.auth.session-cleanup-interval-ms=${SESSION_CLEANUP_INTERVAL_MS:3600000}
app.auth.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.auth.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@greenhouse.local}
app.auth.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
