services:
  # 1. Spring Boot Backend (Docker Web Service)
  - type: web
    name: greenhouse-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        fromDatabase:
          name: greenhouse-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: greenhouse-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: greenhouse-db
          property: password
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: MQTT_ENABLED
        value: "false" # Đổi thành true khi cấu hình Cloud MQTT Broker
      - key: CORS_ALLOWED_ORIGINS
        value: "https://greenhouse-frontend.onrender.com"

  # 2. Frontend React Vite (Static Site)
  - type: web
    name: greenhouse-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    plan: free
    region: singapore
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Managed PostgreSQL Database trên Render
  - name: greenhouse-db
    databaseName: iot_greenhouse
    user: postgres
    plan: free
    region: singapore
